<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카드 분류 작업실</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3eb;color:#203a36;font-family:system-ui,'Malgun Gothic',sans-serif}button{font:inherit;cursor:pointer}header{padding:22px 5%;border-bottom:1px solid #d5dbcf;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;font-size:21px}.brand span{color:#cc573b}button{border:1px solid #c9d2c8;border-radius:9px;background:#fffdf7;color:#203a36;padding:11px 18px}button:hover{background:#e5eadd}button:focus-visible{outline:3px solid #df9231;outline-offset:4px}main{max-width:1200px;margin:auto;padding:34px 28px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:#69786d}h1{font-size:clamp(28px,4vw,46px);letter-spacing:-2px;margin:12px 0}p{line-height:1.8}.lead{color:#647369;margin:0 0 28px}nav{display:flex;gap:7px;flex-wrap:wrap}nav button{padding:9px 13px;font-size:13px}nav .active{background:#244f44;color:white;border-color:#244f44}.workspace{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;margin-top:26px}.panel{border:1px solid #d2d8cb;border-radius:18px;padding:24px;background:#fffdf7}.panel-title{display:flex;justify-content:space-between;font-weight:800;margin-bottom:18px}.badge{background:#e8ecdf;padding:3px 10px;border-radius:30px;font-size:12px}.cards{display:flex;gap:11px;flex-wrap:wrap;align-content:flex-start;min-height:260px}.card{width:76px;height:110px;position:relative;background:white;border:1px solid #d4d8cf;box-shadow:0 3px 0 #dce0d5;border-radius:9px;padding:8px;text-align:left;transition:transform .15s;touch-action:manipulation}.card:hover{transform:translateY(-5px);background:#fff}.card .rank{font-weight:850;font-size:18px;display:block}.card .suit{display:block;text-align:center;font-size:36px;line-height:1.1}.card .small{position:absolute;bottom:7px;right:8px;font-size:15px}.red{color:#cb503e}.black{color:#273b37}.joker .rank{font-size:10px}.joker .suit{font-size:31px;margin-top:9px}.drop{background:#e6edde;border:2px dashed #a3b59a;min-height:310px}.drop.over{border-color:#c77c26;background:#f4e5c4}.hint{font-size:13px;color:#69786d;margin-top:15px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:24px}.primary{background:#244f44;color:white;border-color:#244f44}.primary:hover{background:#346451}.feedback{margin-top:22px;padding:22px;border-radius:13px;background:#fff0cd;border-left:4px solid #c58a33;line-height:1.85}.feedback.good{background:#dfeadc;border-color:#547d51}.feedback h3{margin:0 0 6px}.nested{background:#f1ddd6;border:2px solid #be7663;border-radius:25px;padding:20px;margin-top:14px}.outer{padding:22px;border:2px solid #b77a70;background:#faeae3;border-radius:30px}.inner{padding:18px;margin:14px 0;background:#e2e9ce;border:2px solid #7c9453;border-radius:25px}.mini{display:inline-block;padding:5px 9px;border:1px solid #d2d8cb;background:white;border-radius:6px;margin:3px}.lesson{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:26px}.lesson article{background:#fffdf7;border:1px solid #d2d8cb;border-radius:16px;padding:24px}.lesson h2{font-size:20px;margin-top:0}.formula{font-size:19px;background:#e9eee1;border-radius:9px;padding:14px;overflow-wrap:anywhere}.footer{margin-top:35px;font-size:12px;color:#728073}.quiz button{margin:5px}.progress{height:4px;background:#dee4d7;margin-top:22px;border-radius:8px}.progress i{display:block;height:100%;background:#ce6a48;border-radius:8px}@media(max-width:760px){main{padding:25px 16px}.workspace,.lesson{grid-template-columns:1fr}.card{width:66px;height:96px}.panel{padding:18px}header{padding:17px}.brand{font-size:17px}.cards{min-height:120px}.drop{min-height:220px}}
</style>
<header><div class="brand">♠ CARD <span>WORKSHOP</span><small style="font-size:12px;margin-left:12px">카드 분류 작업실</small></div><button id="restart">처음부터</button></header><main id="app"></main>
<script>
const deck=[['sA','A','♠','스페이드'],['d3','3','♦','다이아'],['c3','3','♣','클로버'],['h3','3','♥','하트'],['s3','3','♠','스페이드'],['d7','7','♦','다이아'],['h2','2','♥','하트'],['cK','K','♣','클로버'],['hQ','Q','♥','하트'],['s10','10','♠','스페이드'],['dA','A','♦','다이아'],['c5','5','♣','클로버'],['j','JOKER','✦','조커'],['h8','8','♥','하트']];
const red=c=>['♦','♥'].includes(c[2]);const missions=[{title:'빨간색 카드를 모아 주세요.',sub:'다이아 ♦와 하트 ♥ 카드를 분류 상자로 옮겨 주세요.',test:red,label:'빨간색',explain:'누가 골라도 같은 카드를 모을 수 있네요. 빨간색인지 분명하게 판단할 수 있기 때문이에요.'},{title:'숫자가 2 이상 4 이하인 카드를 모아 주세요.',sub:'2, 3, 4인 카드를 찾아보세요. 무늬는 상관없어요. 오늘 작업대에 있는 카드만 모아 주세요.',test:c=>['2','3','4'].includes(c[1]),label:'2 이상 4 이하',explain:'2 이상 4 이하는 2와 4도 포함해요. 오늘 작업대에서는 하트 2와 숫자 3인 카드 네 장, 모두 5장이 모여요. 숫자 4 카드는 없으므로 넣지 않아요. 이렇게 원소가 만족하는 조건으로 집합을 나타내는 방법을 조건제시법이라고 해요.'},{title:'강력한 카드를 모아 주세요.',sub:'여러분이 생각하는 강력한 카드를 자유롭게 골라 보세요.',label:'강력한 카드',explain:'A가 강할까요, K가 강할까요, 조커가 강할까요? 게임 규칙이나 생각에 따라 달라져요. 기준이 정해지지 않은 ‘강력한 카드의 모임’은 집합이라고 하기 어려워요. ‘숫자가 3인 카드’처럼 누구나 판단할 수 있는 기준이 필요해요.'},{title:'다이아 카드를 모아 주세요.',sub:'이번에는 무늬가 다이아 ♦인 카드만 찾아보세요.',test:c=>c[2]==='♦',label:'다이아',explain:'다이아 카드는 모두 빨간색 카드예요. 다이아 집합 D의 모든 원소가 빨간색 집합 R에 들어 있어요. 이때 D는 R의 부분집합이에요.'},{title:'숫자가 9인 카드를 모아 주세요.',sub:'오늘 작업대에 있는 14장 안에서만 찾아 주세요. 한 장도 없어도 제출할 수 있어요.',test:c=>c[1]==='9',label:'숫자 9',explain:'오늘 작업대에는 숫자 9 카드가 없어요. 기준은 분명하지만 해당하는 원소가 없네요. 원소가 하나도 없는 집합을 공집합이라고 하고 ∅로 나타내요. n(∅) = 0이에요.'}];
let step=0,chosen=new Set(),done=false,msg='',page='work';let answers={};const app=document.querySelector('#app');
function card(c){return `<button draggable="true" class="card ${red(c)?'red':'black'} ${c[0]==='j'?'joker':''}" data-id="${c[0]}" aria-label="${c[3]} ${c[1]}, ${chosen.has(c[0])?'작업대로 되돌리기':'분류 상자로 옮기기'}"><span class="rank">${c[1]}</span><span class="suit">${c[2]}</span><span class="small">${c[2]}</span></button>`}
const minis=arr=>arr.map(c=>`<span class="mini ${red(c)?'red':'black'}">${c[2]}${c[1]}</span>`).join('');
function render(){if(page==='lesson')return lesson();const m=missions[step];app.innerHTML=`<div class="eyebrow">SET LAB / 신입 작업자의 첫 임무</div><h1>${m.title}</h1><p class="lead">${m.sub}</p><nav>${missions.map((x,i)=>`<button data-step="${i}" class="${step===i?'active':''}">${i+1}. ${x.label}</button>`).join('')}<button id="learn">개념 정리 ↗</button></nav><div class="progress"><i style="width:${(step+1)*20}%"></i></div><div class="workspace"><section class="panel" id="source"><div class="panel-title">01 / 카드 작업대 <span class="badge">${14-chosen.size}장</span></div><div class="cards">${deck.filter(c=>!chosen.has(c[0])).map(card).join('')}</div><div class="hint">카드를 끌어 옮기거나 클릭하세요. 키보드: Tab → Enter</div></section><section class="panel drop" id="target"><div class="panel-title">02 / 분류 상자 <span class="badge">${chosen.size}장</span></div><div class="cards">${deck.filter(c=>chosen.has(c[0])).map(card).join('')}${chosen.size?'':'<p class="hint">조건에 맞는 카드를 여기에 놓아 주세요.<br>비어 있는 상자도 답이 될 수 있어요.</p>'}</div></section></div><div class="actions"><button class="primary" id="check">${step===2?'내 선택 살펴보기':'분류 완료 · 확인하기'}</button><button id="clear">상자 비우기</button>${done?`<button class="primary" id="next">${step===4?'작업 완료! 개념 정리 →':'다음 미션 →'}</button>`:''}</div><div role="status" aria-live="polite">${msg?`<div class="feedback ${done?'good':''}">${msg}</div>`:''}</div>${done&&step===3?`<div class="outer" style="margin-top:20px"><b>빨간색 카드 집합 R</b><div class="inner"><b>다이아 카드 집합 D</b><br>${minis(deck.filter(c=>c[2]==='♦'))}</div>${minis(deck.filter(c=>c[2]==='♥'))}<p>D ⊂ R · 다이아 카드는 모두 빨간색 카드 안에 있어요.</p></div>`:''}<div class="footer">카드 분류 작업실 · 계산 없이 시작하는 집합 · 오늘의 전체 카드 14장</div>`;bind()}
function move(id,to){if(!deck.some(c=>c[0]===id))return;if(to)chosen.add(id);else chosen.delete(id);done=false;msg='';render()}
function bind(){document.querySelectorAll('[data-id]').forEach(el=>{el.onclick=()=>move(el.dataset.id,!chosen.has(el.dataset.id));el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.id)});['source','target'].forEach(id=>{const el=document.getElementById(id);el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');el.ondrop=e=>{e.preventDefault();move(e.dataTransfer.getData('text/plain'),id==='target')}});document.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>start(+el.dataset.step));document.getElementById('learn').onclick=()=>{page='lesson';render();scrollTo(0,0)};document.getElementById('clear').onclick=()=>start(step);document.getElementById('check').onclick=check;const next=document.getElementById('next');if(next)next.onclick=()=>{if(step===4){page='lesson';render()}else start(step+1);scrollTo(0,0)}}
function start(i){step=i;chosen=new Set();done=false;msg='';page='work';render()}
function check(){const m=missions[step];if(step===2){done=true;msg='<h3>같은 기준으로 골랐을까요?</h3>'+m.explain+'<p><b>이야기해 보기:</b> 옆 친구와 선택을 비교하고, 모두가 같은 카드를 고를 수 있게 기준을 바꿔 보세요.</p>'}else{const wrong=deck.filter(c=>chosen.has(c[0])&&!m.test(c)).length,missing=deck.filter(c=>!chosen.has(c[0])&&m.test(c)).length;done=!wrong&&!missing;msg=done?'<h3>분류 완료! 잘 살펴봤어요.</h3>'+m.explain:`다시 살펴볼까요? 조건에 맞지 않는 카드 ${wrong}장, 아직 옮기지 않은 카드 ${missing}장이 있어요. 무늬와 숫자를 확인해 보세요.`}render()}
function lesson(){app.innerHTML=`<div class="eyebrow">WORK COMPLETE / 작업에서 수학으로</div><h1>우리가 모은 카드가, 집합이 돼요.</h1><p class="lead">방금 한 일을 수학의 언어로 정리해 볼까요? 여기서 다루는 카드는 오늘 작업대의 14장이에요.</p><button id="back">← 카드 작업으로 돌아가기</button><div class="lesson"><article><h2>01 집합과 원소</h2><p>어떤 대상이 속하는지 분명하게 판단할 수 있는 모임을 <b>집합</b>, 그 집합에 들어 있는 각각의 대상을 <b>원소</b>라고 해요.</p><div class="formula">D = {♦3, ♦7, ♦A}</div><p>집합 D의 원소는 카드 3장이에요. ‘강력한 카드’는 규칙을 정해야 판단할 수 있어요.</p></article><article><h2>02 원소와 집합의 관계</h2><p>원소가 집합에 속하면 ∈, 속하지 않으면 ∉를 써요.</p><div class="formula">♦3 ∈ D &nbsp; ♥3 ∉ D</div><p>♦3은 다이아 집합의 원소예요. ♥3은 다이아 집합의 원소가 아니에요.</p></article><article><h2>03 집합을 표현하는 방법</h2><p><b>원소나열법</b>은 원소를 중괄호 안에 하나씩 써요.</p><div class="formula">D = {♦3, ♦7, ♦A}</div><p><b>조건제시법</b>은 원소의 공통 조건을 써요.</p><div class="formula">B = {x | x는 오늘 카드 중 숫자가 2 이상 4 이하인 카드}</div><p>2번 미션의 조건을 그대로 쓴 거예요. 같은 집합을 원소나열법으로 쓰면 B = {♥2, ♦3, ♣3, ♥3, ♠3}이고, n(B) = 5예요. 조건에 맞더라도 오늘 작업대에 없는 카드는 넣지 않아요.</p><p><b>벤 다이어그램</b>은 닫힌 곡선 안에 원소를 넣어 나타내요.</p><div class="inner" style="text-align:center">D<br>${minis(deck.filter(c=>c[2]==='♦'))}</div></article><article><h2>04 원소의 개수와 공집합</h2><p>집합 D의 원소 개수는 n(D)로 나타내요.</p><div class="formula">n(D) = 3 &nbsp; n(R) = 7</div><p>오늘 카드 중 숫자 9인 카드의 집합은 원소가 없어요. 이런 집합이 <b>공집합</b>이에요.</p><div class="formula">∅ = { } &nbsp; n(∅) = 0</div><p>∅와 {∅}는 달라요. {∅}는 공집합 자체를 원소로 하나 가지므로 원소 개수가 1이에요.</p></article><article><h2>05 포함관계와 부분집합</h2><p>D의 모든 원소가 R에도 속하면 D는 R의 <b>부분집합</b>이에요. 이 관계를 <b>포함관계</b>라고 해요.</p><div class="outer">R · 빨간색 카드<div class="inner">D · 다이아 카드<br>${minis(deck.filter(c=>c[2]==='♦'))}</div>${minis(deck.filter(c=>c[2]==='♥'))}</div><div class="formula" style="margin-top:15px">D ⊂ R</div><p>원소와 집합에는 ∈, 집합과 집합에는 ⊂를 써요. 공집합은 모든 집합의 부분집합이고, 모든 집합은 자기 자신의 부분집합이에요.</p></article><article><h2>06 서로 같은 집합</h2><p>원소가 완전히 같으면 같은 집합이에요. 순서와 중복은 상관없어요.</p><div class="formula">{♦3, ♦7, ♦A} = {♦A, ♦3, ♦7}</div><p>{♦3, ♦3, ♦7, ♦A}도 같은 집합이에요. 중복된 원소는 한 번만 세므로 원소 개수는 3이에요.</p><p>A ⊂ B이고 B ⊂ A이면 A = B예요.</p></article><article><h2>07 진부분집합</h2><p>D가 R의 부분집합이면서, D와 R이 서로 다르면 D는 R의 <b>진부분집합</b>이에요.</p><div class="formula">D ⊂ R, D ≠ R → D ⊊ R</div><p>R에는 D에 없는 하트 카드도 있어요. 따라서 D는 R의 진부분집합이에요. R은 자기 자신의 부분집합이지만 진부분집합은 아니에요.</p><p class="hint">이 작업실에서는 부분집합 기호로 ⊂를 사용해요. 진부분집합은 D ⊂ R이면서 D ≠ R인 경우예요.</p></article><article class="quiz"><h2>08 퇴근 전, 마지막 확인!</h2><p>다이아 집합 D와 빨간색 집합 R을 떠올려 보세요.</p>${[['♦3은 D의 원소이다.',true],['D는 R의 진부분집합이다.',true],['공집합의 원소 개수는 1이다.',false]].map((q,i)=>`<div><b>${i+1}. ${q[0]}</b><br><button data-q="${i}" data-a="true">맞아요</button><button data-q="${i}" data-a="false">아니에요</button><span id="a${i}" role="status">${answers[i]||''}</span></div>`).join('')}</article></div><div class="feedback good"><b>오늘의 발견</b><br>집합은 ‘기준이 분명한 모임’이에요. 카드는 원소가 되고, 카드의 모임끼리는 포함관계를 살펴볼 수 있어요.</div>`;document.getElementById('back').onclick=()=>{page='work';render()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,ok=(b.dataset.a==='true')===[true,true,false][i];answers[i]=ok?'✓ 맞았어요!':'다시 생각해 보세요.';document.getElementById('a'+i).textContent=answers[i]})}
document.getElementById('restart').onclick=()=>{answers={};start(0)};render();
</script></html>
